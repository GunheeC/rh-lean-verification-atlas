name: Verify the atlas
'on': [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - run: python scripts/validate.py
      - run: python scripts/unit_pages.py --check
      - run: python scripts/dashboard.py --check
      - run: python scripts/build_site.py --check
