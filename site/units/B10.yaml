  "statement": "Take finite units $U_0$, nonempty finite word sets $W(u)$, finite top\nindices, and lattice data with $m$ columns and $f$ places. Take a finite\nabelian group $H$, a map $\\operatorname{tr}:U_0\\to H$, and arithmetic\ndata as in \\hyperref[sub:B09]{B09}. Assume top and place bijections\nidentify the coefficients $a_t$, column weights, Euler constant and\n$\\Re\\ell(\\chi_C)$, and express the lattice $\\mathrm{ASK}(u)$ as the\nsum of its arithmetic terms at $\\operatorname{tr}u$.\nAssume the eleven lattice hypotheses of \\nodeid{P021} and the following\nbounds on the data. With $x\\ge1$, $0<\\varepsilon\\le1$,\n$b\\ge1$, $xb\\le a$, $n_T\\ge1$, $m\\le x^{1/2+\\varepsilon/2}$,\n$xm\\le k$, one has\n\\[\n 1\\le k\\le\\min(a,x^{e_K}),\\quad 0\\le L,L_a\\le2x^\\varepsilon,\\quad\n 0\\le kb'\\le a,\\quad 0\\le X''\\le a,\\quad 0\\le a_t\\le2a .\n\\]\nAlso $e_K\\ge0$, $\\log|W(u)|\\le(k-3)\\log2$, $\\bar\\delta\\le1/2$,\n$\\bar\\eta,\\bar e\\ge0$, and\n$(\\bar\\eta+4\\sqrt{\\bar e})x^{c_{HH}}b\\le Kx^\\varepsilon n_Ta$.\nThe seven constants controlling division, the $E$ and $H$ errors, counting,\nslope, first-slope and loss bounds are in $[0,K]$; the exponents\n$e_{\\rm Div},e_{\\rm Loss},c_{HH}$ are nonnegative. Finally\n\\[\n\\begin{gathered}\n 0\\le B_0\\le 2nmbx^\\varepsilon,\\qquad\n 0\\le N_c\\le n_2 k b x^\\varepsilon/(n^2x^{-\\varepsilon}),\\\\\n \\max\\{\\log x,200(1+K)^2(1+c_{HH})(1+e_K)\\}\\le x^\\varepsilon .\n\\end{gathered}\n\\]\nFor each $u\\in U_0$ the gap at $\\operatorname{tr}u$ is at most\n$x^{(e_{\\rm Div}+e_{\\rm Loss}+3)\\varepsilon}\\mathrm{Br}$ with $a_E=a$.",
