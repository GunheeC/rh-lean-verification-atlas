  "statement": "\\textbf{Z4.2.09.} For a site satisfying Pair, Pos, Move and Away, obtain the inverse-$\\kappa$ transformation identity for the frame series under the arithmetic group, together with the LawInLt and XiIn conditions for this same local system. \\textbf{Z4.2.10.} At a site with dictionary, Pair, Pos and Law, for every extension of the chosen algebraic embedding there exists a $p$-adic norm-one scalar giving KernelDifferenceAtLevel at $j=0$ for these comparison maps and series. \\textbf{Z4.2.11.} With the same dictionary, Pair, Pos and Law and for each $1\\le j<m$, every extension of the chosen algebraic embedding admits a norm-one scalar giving KernelDifferenceAtLevel at that $j$. \\textbf{Z4.2.12.} With AdmAtEnt2, CurveEx, a joint $J$, a used tuple, trivial level-zero stabilizers and $2r_G\\le k$, the very chain $\\mathrm{chainAt}(H,h_T)$ carries both the comparison data and an admitted site system with $d_G(0)=0$ and $d_G(j)$ bounded by the stabilizer valuation.",
  "assumptions": [
    "source:blueprint_v13"
  ],
  "hypothesis_details": [
    "The transformation branch requires Pair, Pos, Move and Away.",
    "At level zero assume the dictionary, Pair, Pos and Law, and fix the algebraic embedding and its extension. A positive stage satisfies $0<j<m$.",
    "For the final comparison assume AdmAtEnt2 and CurveEx with a joint, a used tuple, trivial level-zero stabilizers and twice the rank at most $k$."
  ],
