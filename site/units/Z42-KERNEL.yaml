  "open_questions": [
    "Supply \\nolinkurl{TieBase.base_data} (Z4.2.13), \\nolinkurl{KerMove.kerTh_move} and the bad-prime exclusion in \\nolinkurl{lev_pos_and_noConj}. For the full modelXi and movesCompose interfaces derive the geometric half-lattice comparisons for arbitrary curve bases and the simultaneous split-supported changes of a triple.",
    "Class-kernel pullback under rational isometries, including the tied base in Z4.2.13 and kernel covariance; component-independent unit; source factor identity; moved source operator and degrees; target frame realization. Supporting inputs are tuple decomposition, the class entry polynomial, its extended weight, frame invertibility, character product and reading from all realizations. Direct suppliers in the all-step argument include \\nolinkurl{sysS_ranks}, \\nolinkurl{rk_le}, \\nolinkurl{ltC_ne}, \\nolinkurl{equiv_frame_b} and \\nolinkurl{kernelSite_contractionIdentity_operatorHalf}.",
    "Supply \\nolinkurl{joint_at_nonempty} (.02), \\nolinkurl{pairOK_allSites} (.04), \\nolinkurl{site_law_xiIn} (.09) with \\nolinkurl{TieBase.base_data} (.13), and the five common inputs of the differential changes (.10 and .11). In the assembly prove the remaining fields of \\nolinkurl{kernelSite_seriesData_below_lastStep}, the stabilizer comparison \\nolinkurl{tieStab_kaAtAny}, and the realizing-polynomial comparison in \\nolinkurl{series_reading_entries}."
  ],
