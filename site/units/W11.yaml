  "statement": "Let $\\ell$ be any prime and $K/\\mathbb Q$ a finite abelian extension\ncontaining $\\mu_\\ell$ for odd $\\ell$, or $\\mu_4$ for $\\ell=2$. There\nis an integer $r\\ge0$ such that for every $n\\ge0$ and every model\n$K'$ of $K(\\mu_{\\ell^n})$ over $K$,\n\\[\n    \\big|\\operatorname{Cl}(K')/\\operatorname{Cl}(K')^\\ell\\big|\\le\\ell^r .\n\\]",
