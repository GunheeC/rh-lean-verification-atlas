  "statement": "Let \\(L\\) be totally complex and \\(\\ell\\) prime. Suppose \\(\\ell^c\\)\nis the largest \\(\\ell\\)-power order of a root of unity in \\(L\\),\n\\(c\\ge1\\) and \\(c\\ge2\\) at \\(\\ell=2\\). Fix \\(E\\ge1\\). If for every\nallowed layer \\(F/L\\) the preceding character group, defined with\n\\(a=(1+\\ell^c)^E\\), is finite of order at most \\(B\\), then there\nexists \\(s\\in\\mathbb N\\) such that\n\\[\n \\operatorname{shaInv}(L,\\ell,E)=s,\\qquad \\ell^s\\le B .\n\\]",
  "assumptions": [
