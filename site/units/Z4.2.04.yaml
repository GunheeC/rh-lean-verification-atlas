{
  "id": "Z4.2.04",
  "title": "Theta kernels for adjacent pairs",
  "track": {
    "primary": "theta",
    "secondary": [
      "local"
    ]
  },
  "statement": "At every site obeying the dictionary, two consecutive valid tuples give admitted kernel lattices, a locally constant datum in the indicated congruence sense, an entire theta kernel with algebraic coefficients, the indicated algebraic scalars with nonzero character factor, and unit frames giving the two local spans.",
  "assumptions": [
    "source:blueprint_v13"
  ],
  "hypothesis_details": [
    "The site satisfies its prescribed dictionary.",
    "The two consecutive lattice tuples are valid."
  ],
