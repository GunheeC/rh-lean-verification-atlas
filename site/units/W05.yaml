  "statement": "Assume the rank-$n$ literature record. There is a real $C_K$ such that,\nfor every prime $\\ell$, totally complex field $L$ containing a primitive\n$\\ell$th root (a fourth root for $\\ell=2$), algebraic closure and\nlocal data, and $e\\ge1$, the group $H^2(G_{L,\\ell},\\mathbb Z_\\ell(e+1))$\nis finite. With $r=[L:\\mathbb Q]$ and $D=|\\operatorname{disc}(L)|$,\n\\[\n \\log\\# H^2(G_{L,\\ell},\\mathbb Z_\\ell(e+1))\n \\le \\exp\\big((2er)^{C_K}\\log(2D)\\big).\n\\]",
