  "statement": "Assume $H'$, W05 and the rank-four conclusions of W06. Each of the\nfollowing two cases has its own $C\\in\\mathbb N$ depending only on\n$\\chi$. For every large host, $0<e<t$, odd $\\ell$, closure, coefficient\nring and $\\psi\\in X_h(O,e)$ in the case, the length is finite and\n$v_\\ell(\\psi,e)\\log\\ell\\le(\\ell Ne)^C$:\n\\begin{itemize}\n\\item Case II requires $e\\ge2$, even order of $\\chi_P$, and either\n$\\ell\\in B_\\chi$ or $\\ell-1\\mid2e$.\n\\item Case III requires $\\ell\\notin B_\\chi$, $\\ell-1\\mid2e$ and\n$\\psi$ nontrivial of odd order.\n\\end{itemize}",
