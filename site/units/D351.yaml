  "statement": "On a compact Hausdorff space with a finite holomorphic atlas of complex dimension e+1, let a section of a metrized line datum have a simple normal crossings divisor with multiplicities \\nolinkurl{m_k} and holomorphic component inclusions. For any smooth test function and e admissible potentials, integration against the log norm equals the sum of the component integrals weighted by \\nolinkurl{m_k} minus the ambient curvature integral.\n\\[\nI_A((v,\\Phi),\\log\\|s\\|)=\\sum_k m_k I_{W_k}(\\iota_k^*\\Phi,\\iota_k^*v)-I_A((L,\\Phi),v).\n\\]",
  "assumptions": [
    "source:paper2_v3"
  ],
  "hypothesis_details": [
    "Use a compact Hausdorff space with a finite holomorphic atlas, an admissible metrized line and section, and a simple normal crossings divisor with holomorphic component inclusions.",
    "The test function is smooth and each of the $e$ potentials is admissible."
