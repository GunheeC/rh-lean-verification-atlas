  "statement": "\\textbf{Z4.2.06.} The dictionary implies MoveTie: an arithmetic group translate at a source tuple is implemented by a rational unitary matrix on its frames and kernel lattice and by an algebraic scalar on the kernel datum, with the prescribed $\\kappa$ factor after normalization. \\textbf{Z4.2.07.} For each local place $v$ and $j<m$, the dictionary supplies a split prime with the specified integral approximation and excluded-support conditions. Tuples with identical away data have matching off-prime lattices, frames and kernel datum, with the scalar ratio given by two valuation-zero factors and the two lengths. \\textbf{Z4.2.08.} For a given site $S$ and dictionary $J.\\mathrm{Dict}(\\mathrm{std})$, the scalar for each source representative and adjacent valid target at $j<m$ is algebraic and its $p$-adic image times $p^{\\mathrm{exp}_G}$ has norm at most one.",
  "assumptions": [
    "Z4.2.02",
    "Z4.2.04",
    "source:blueprint_v13"
  ],
  "hypothesis_details": [
    "For the translation law assume a site dictionary with the pair-admission and algebraicity data for the scalar and character factors.",
    "For the away comparison use the actual joint with self-dual, coefficient-compatible adjacent data. The scalar law also requires the indicated even ranks."
  ],
