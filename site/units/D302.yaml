  "statement": "For each degree r of a period algebra at a prime l, every element of Fil0(r) is congruent modulo Fil0(r+1) to a coefficient from W times dxi0(r). Such a multiple is in Fil0(r+1) exactly when its coefficient lies in the ideal generated by xi. For each element z of Fil0(r) some l-power times z equals the image in Acr0 of xi\\textasciicircum{}r times an element of W.\n\\[\n\\mathrm{Fil}_r/\\mathrm{Fil}_{r+1}= (W/(\\xi))\\,\\overline{d\\xi_0(r)},\\qquad z\\in\\mathrm{Fil}_r\\ \\Longrightarrow\\ \\exists N\\ge0,\\ w\\in W,\\ \\ell^N z=\\iota(\\xi^rw).\n\\]",
