  "statement": "Assume local cohomological finiteness, Tate duality, the Euler\ncharacteristic formulas and the local Bloch--Kato theorem in the\nspecified coefficient models. Assume the dense ordinary vanishing\nhypothesis: at every locally generic automorphic point below each\nallowed ordinary adjoint cocycle is a coboundary. Let \\(L\\) be CM with\n\\(\\mu_\\ell\\not\\subset L\\), take a Hida setting and level \\(V\\) with\n\\(V.S'=S\\), large coefficients, \\(2\\le n\\le4\\), an admitted residual\nrepresentation, and a locally generic automorphic point \\(x,\\rho\\)\nof its universal ordinary determinant ring. For each \\(v\\mid\\ell\\)\nsuppose there are strictly decreasing integers \\(m_i\\) and \\(k>0\\)\nsuch that on inertia\n\\[\n \\bigl(\\psi_{v,i}\\psi_{v,j}^{-1}\\chi^{m_j-m_i}\\bigr)^k=1\n \\quad(i,j=1,\\ldots,n).\n\\]\nFor every allowed polarizing form and adjoint extension \\(R\\), each\ncontinuous cocycle \\(z\\) whose pullback satisfies the Bloch--Kato\nfinite condition has the form \\(z(g)=R(g)X-X\\) for one matrix \\(X\\)\nand all \\(g\\).",
