  "statement": "For a full finitely generated lattice in an invertible frame over a totally complex field of degree $n$, the real realization has rank $nD$. For the free lattice $B$ of a full basis, its height is the product of its complex Gram determinants; for full $L\\supseteq B$, $\\mathrm{ht}(L)[L:B]=\\mathrm{ht}(B)$.",
