  "statement": "Let \\(K\\) be a totally complex number field with its given star structure, \\(V\\) a finite-dimensional \\(K\\)-space with the compatible \\(\\mathcal O_K\\)-action, \\(b\\) a basis and \\(X_v\\) invertible complex frames. For a \\(K\\)-independent family \\(e_1,\\ldots,e_j\\), set \\(B=\\sum_i\\mathcal O_K e_i\\). Then\n\\[\n \\operatorname{ht}_{b,X}(B)=\\prod_{v\\mid\\infty}\\operatorname{Re}\\det\\operatorname{Gram}_{v,b,X}(e).\n\\]\nFor every finitely generated \\(\\mathcal O_K\\)-module \\(L\\supset B\\) of \\(K\\)-rank \\(j\\), one has \\(\\operatorname{ht}_{b,X}(L)[L:B]=\\operatorname{ht}_{b,X}(B)\\).",
