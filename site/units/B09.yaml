  "statement": "Fix $C\\ge0$, $\\varepsilon>0$, $|c|\\le1$ and $C_E,K_o,M\\in\\mathbb R$.\nThere is $x_1$ such that the implication below holds for every $x\\ge x_1$.\nTake a finite abelian group $H$, its prescribed arithmetic host facts\nat the finite excluded set $S$, character constants $\\ell(\\xi)$, and\n$T_2\\subset A_0\\le H$, $TT\\subset H$. Write $n=|H|$, $n_2=|T_2|$,\n$n_T=|TT|$, $\\delta_2=n_2/n$, and $f=|\\Gamma_\\Phi|$.\nFor $b,k>0$, $a_E\\ge0$ and integers $m,N\\ge0$ assume\n$m\\le x^{1/2+\\varepsilon/2}$, $xm\\le k$, and the following conditions.\n\\begin{itemize}\n\\item The width parameters satisfy $\\eta,\\theta\\ge0$, $b',X'>0$,\n$b'X'\\le xb$ and $|a_t/b-x|\\le1$ on $TT$.\nEach positive column weight $w_{u,j}(\\rho)$ ($u\\in A_0$,\n$\\rho\\in\\Gamma_\\Phi$) is in $[b,b+\\eta+1]$ on the thick places\nindexed by $T_2+u$ and at most $2b'$ elsewhere. The cutoff obeys\n$a_t/w_{u,j}(\\rho)\\le N$.\n\\item Every frequency satisfies $|G_\\xi(y)|\\le y\\theta$ for $y\\ge X'/3$;\n$2f(x+1)\\theta\\le1/x$, $6f(x+1)(\\eta+1)\\le b/x$.\nAlso $a_E\\le2xb$, $n_T\\ge nx^{-\\varepsilon/8}/2$,\n$\\delta_2\\ge x^{-\\varepsilon}$, $m\\ge x^{1/2-\\varepsilon}$,\nand $k\\le n^2x^{1/2-\\varepsilon}$.\n\\item Write $A_0^\\perp$ for the frequencies trivial on the embedded $A_0$.\nThe kept set $K'$ contains the trivial character, lies in $A_0^\\perp$,\nand its characters take value one at the distinguished element $s_0$;\n$|A_0^\\perp|\\le M$. For kept characters nontrivial on the embedded $H$,\n$|\\sum_{t\\in TT}\\xi(t)-cn_T|\\le M x^{-1+\\varepsilon}n_T$.\nThe bounds on $|\\ell(\\xi)|$ are $K_o$ for kept nontrivial characters\nand $C_E\\log x$ for discarded members of $A_0^\\perp$.\n\\end{itemize}\nSet\n\\[\n \\mathrm{Br}=n_Ta_E(1+m^2/k)+\n m\\left(2nmbx^\\varepsilon+\n          \\frac{n_2kbx^\\varepsilon}{n^2x^{-\\varepsilon}}\\right).\n\\]\nIf for every $u\\in A_0$ the gap (the sum of $\\mathrm{ASK}-\\Re\\mathrm{MAIN}$\nover $TT$ and the $m$ columns) is at most $x^{C\\varepsilon}\\mathrm{Br}$,\nthen\n\\[\n \\sum_{\\xi\\in K'}\\mathrm{wt}_c(\\xi)\\Re G_\\xi(x)\n \\le x^{1/2+(C+3)\\varepsilon}+\\sum_{\\xi\\in A_0^\\perp\\setminus K'}|G_\\xi(x)|,\n\\]\nwhere $\\mathrm{wt}_c$ is $1$ on characters trivial on the embedded $H$\nand $c$ otherwise.",
