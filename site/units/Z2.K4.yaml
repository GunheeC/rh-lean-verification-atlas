  "statement": "For totally complex $L$, even $k$, $k+1<r_2(L)$, $\\ell>0$ and $n\\ge2(k+1)+4$, the span of the $z$-sequence in degree $k+1$ has integral rank at most $r_2(L)$. For $n'\\ge n\\ge2m+4$, torsion in degree $m$ of $\\mathrm{GL}_{n'}(\\mathcal O_L)$ is finite and has the same order as at rank $n$.",
