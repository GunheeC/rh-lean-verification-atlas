  "statement": "Let $E/E^+$ be CM, unramified at every finite prime, $n\\ge1$, and $\\pi$\nan automorphic representation of the specified definite unitary group.\nThere is a partition $n=\\sum_i N_i$ with positive parts and a discrete\n$\\mathrm{GL}_{N_i}(\\mathbb A_E)$ constituent $V_i$ for each part.\nEach is an ascending constituent built from a normalized unitary\nconjugate-self-dual cusp form. There are local components $\\sigma_{iw}$\nand infinitesimal characters $m_{i\\tau}$ of $V_i$. At each finite $w$\nthere is an irreducible subquotient $P_w$ of the local induced product\nof the $\\sigma_{iw}$. It is spherical when $\\pi$ is unramified there,\nhas the base-changed Satake multiset for each inert unramified datum,\nand realizes the unitary local component at split places. At each\nembedding $\\tau$, the sum of the $m_{i\\tau}$ equals the infinitesimal\ncharacter attached to each weight of $\\pi$ at $\\tau$.",
