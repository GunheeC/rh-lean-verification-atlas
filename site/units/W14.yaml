  "statement": "Assume the following character estimate. For every abelian CM field\n$F$, compatible algebraic closure, and cyclotomic action of\n$(\\mathbb Z/N\\mathbb Z)^\\times$ on $F$ ($N>0$), take an odd prime\n$\\ell\\nmid[F:\\mathbb Q]$, a finite DVR\n$O\\subset\\overline{\\mathbb Q}_\\ell$ over $\\mathbb Z_\\ell$, $k\\ge1$,\nand a character $\\psi$ of $\\operatorname{Gal}(F/\\mathbb Q)$ valued in\n$O^\\times$. Write $\\chi$ for the induced character modulo $N$.\nIf $\\chi(-1)=(-1)^{k+1}$, the $O$-length of the $\\psi$-eigenspace\nof the localization kernel with twist $-k$ is at most\n$\\operatorname{ord}_O(a)$ for every $a\\in O$ representing the\ndenominator-cleared primitive Bernoulli value\n$\\operatorname{den}(N,k+1)B_{\\rm prim}(k+1,\\chi)$.\nThen there exists a real $C$ such that for every abelian datum $M$,\n$e,t\\ge2$, prime pair $q,d$ as in W12 and CM field $E$ of type\n$(M,e,q,d)$, all its odd-prime minus lengths $h_\\ell^-(E,k)$ for\n$1\\le k<t$ are finite. Put $n=[E:\\mathbb Q]$, $f=\\operatorname{cond}E$,\n$o=\\deg M$. For every finite set $T$ of odd primes,\n\\[\n\\begin{split}\n \\sum_{\\ell\\in T}\\log\\ell\\sum_{1\\le k<t}h_\\ell^-(E,k)\n &\\le 3nt^2\\log(tf)\\\\\n &\\quad+C\\!\\sum_{\\substack{p\\mid o\\\\p\\ {\\rm odd\\ prime}}}\n                  pn^2t^2\\log^2(tpf).\n\\end{split}\n\\]",
