  "statement": "Assume the finite-field Green character statement. For any family class\n$\\mathcal A$, take the data and hypotheses of the alternative shape:\nexistence from the Minkowski division input, the family duties, and a\ntwist selection with spectral, level, height, column and bounded-row\nrealisations. Impose its twist, primitivity, division, point, size,\nliterature, volume, decay and count conditions; its definite rows and\nindefinite selections; its point, period and complement conditions for\nthe served twists; its closed count, projection and real-place ties;\nand its volume-ratio and genus-mass hypotheses. The two scalar predicates\n$V,NR$ in the shape are true. Its extra family premise is the following\nclosed link on $D_3(3,\\mathcal A)$: eventually there are common constants\n$C,x_0$ for a family so that, for each member at $x\\ge x_0$ with finite\nprescribed localisation lengths and each lift $j$, summability of their\nweighted prime terms $v_\\ell$ gives\n\\[\n  \\eta_j\\le dZ_{0,j}\\left[C\\{fmbL^2+(\\log x)^2N_c\\}\n                         +\\sum_\\ell v_\\ell\\right].\n\\]\nHere $\\eta_j$ sums weighted local errors at the varying places. The shape\nconcludes that for every $\\lambda>1$ and every request $G$, if hosts exist\non $\\lambda$-windows and every family in the request class eventually\nsatisfies its Selmer bound, then there are $e_D,e_L$ and $\\varepsilon_1>0$.\nFor every $0<\\varepsilon<\\varepsilon_1$ that class contains a family\nwith constants $K,c_{HH},e_K,C_L,x_0$ and tied data on every window scale\n$x\\ge x_0$.",
