  "statement": "Assume resolution, principalisation, integrated Poincaré--Lelong, the three\nHilbert--Samuel statements, the arithmetic bigness bound, Hodge--Tate\northogonality, the Zarhin splitting and nef Riemann--Roch (T17--T24).\nAssume also integral Siegel toroidal models, the toroidal-fan input for KS,\nseminegativity of the semiabelian Lie bundle, separation of pairs of\npoints, arithmetic degree, the 28 Hodge-bundle inputs, and Grothendieck\ndeformation. There exists $\\varepsilon_1>0$ such that for each\n$0<\\varepsilon\\le\\varepsilon_1$ there is a largeness parameter $K$.\nFor every family $F$ at $\\varepsilon$ and real $H$ with\n$\\mathrm{FamHyp}(F)$ and $F.\\mathrm{Large}(K,H)$, there are\n$C_0\\ge0$ and $x_0$ such that, for $x>x_1$ with $x\\ge x_0$, every family\nindex and point $p$ with the point conditions and reciprocity tie (\\nolinkurl{RowsTAlt}), every\n$C\\ge C_0$ and every $j$, the false-side row satisfies\n\\[\n   \\operatorname{lcv}(XW_j,M_j)/D\\ \\le\\ N(C)_{L3,j}.\n\\]\nThe normalization $D$, row space and lattice in this expression belong to $p$.",
