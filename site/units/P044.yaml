  "statement": "Assume G1--G6. The characteristic coefficients belong to \\(T\\) and the local gain and crystalline conditions hold. The constituents satisfy absolute irreducibility and distinctness with the prescribed residual characteristic polynomials and full residual span on block zero. Ramification away from the assigned sets is trivial, the assigned inertia elements satisfy their polynomial relations, and any parameter admitting the distinguished rational character line belongs to \\(Z\\). Assume tame inertia generators, the Bloch--Kato finite conditions and annihilator comparison, family continuity, semisimple decomposition, Fontaine conditions, local \\(H^1\\) finiteness and local coefficient compatibility. Assume condition 5.1 supplying an idempotent design at \\(\\pi\\in Z\\), and the unramified input for the decomposition. Let \\(b_w,m_w,c_B\\) satisfy the row colength, column lifting and \\(TB\\) hypotheses at the good coefficient extensions. If \\(\\ell\\ne g_0,g_1,\\ \\pi\\in Z\\), the global \\(s_\\pi\\) input is finite and the scalar lengths are finite for \\(0<k<t\\), then\n\\[\n\\begin{aligned}\nv_{\\rm cc}(\\pi)\\le{}&\n \\sum_{w\\in R\\cup C}\\operatorname{lenW}(w)+s_\\pi+\n \\sum_{0<k<t}\\operatorname{shaLen}(k)+v_\\ell(h_E)\\\\\n &+t c_B\\sum_{w\\in R}([E_w:\\mathbf Q_\\ell]+2)\n +4 n_V(|C|+1)v_\\delta+t|C|h_0\n +t\\sum_{w\\in Q}\\operatorname{lenUnit}(O/(\\zeta_w-1)).\n\\end{aligned}\n\\]\nHere \\(R,C\\) are the chosen rows and columns, \\(n_V=r+t\\), and \\(\\operatorname{lenW}\\) is the normalized loss for the corresponding local datum.",
