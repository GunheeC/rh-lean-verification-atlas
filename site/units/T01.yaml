  "statement": "Assume $P,F$, local matching, agreement of theta integrals, the closed\ncovolume bound of T13, a proof $h_L$ of the local existence proposition \\nolinkurl{RecTExists}, and the\nprimitive-character window with constant $401$. Then for every $N\\ge1$,\nevery complex Dirichlet character $\\chi$ modulo $N$, and every $s$ with\n$\\Re s>1/2$, one has $L(s,\\chi)\\ne0$ whenever $\\chi\\ne\\chi_0$ or $s\\ne1$.\nFor each number field, algebraic closure and valuation above a finite place, this proposition asserts the existence of a map satisfying \\nolinkurl{IsRecT}. The two theta assumptions\nare the two conclusions stated in T11.",
