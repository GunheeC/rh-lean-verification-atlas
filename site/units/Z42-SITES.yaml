  "statement": "\\textbf{Z4.2.01.} At a served site with the host tie \\nolinkurl{GatTies} and its tied lattice data and $2r_G\\le k$, every position $v$ of the selected local model satisfies Std with its actual ranks, weights, marked subset and parameters. \\textbf{Z4.2.03.} For $j\\le m$ and an actual lattice tuple, the selected chart point satisfies the point condition and represents the prescribed rational-unitary/level double coset, the kernel lattice agrees after reindexing with the adelic lattice at that point, and its determinant is the prescribed one. \\textbf{Z4.2.05.} At every site the $p$-adic evaluation of the global embedding at position $(v,s)$ agrees with the local twist of the place embedding, applied to the conjugate exactly at odd positions.",
