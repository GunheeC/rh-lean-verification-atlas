  "statement": "Fix a predicate $Q$ on $\\mathcal P$, $\\lambda>1$, and a system of families with core and tied predicates as in \\nolinkurl{TopWin.lean:19--33}. For each $\\psi$ satisfying $Q$, write $\\mathcal L=\\operatorname{cyc}(\\psi)$ and suppose the following.\n\\begin{enumerate}\n\\item For every $e_D,e_L\\in\\mathbb R$, every $\\varepsilon>0$ and every family $F$ at $\\varepsilon$, the conjunction of \\code{EFamC}$(\\mathcal L,F)$ and eventual tiedness on its window set with $e_D,e_L$ implies $\\mathcal G_{\\mathcal L}(x)\\le x^{1/2+(e_D+e_L+7)\\varepsilon}$ at every sufficiently large point of that set.\n\\item The level-window implication of P018 holds for $\\mathcal L$.\n\\item There exist $e_D,e_L\\in\\mathbb R$ and $\\varepsilon_1>0$, common to all subsequent $\\varepsilon$. For every $0<\\varepsilon<\\varepsilon_1$ there is a family $F$ at $\\varepsilon$ satisfying \\code{EFamC}$(\\mathcal L,F)$ with exponent-$\\lambda$ windows and eventual tiedness on that set with these same $e_D,e_L$. In both clauses eventual tiedness uses fixed $K,c_{HH},e_K,C_L,x_0$ for the selected family, as in P017.\n\\end{enumerate}\nThen $L(s,\\psi)\\ne0$ for every $\\psi$ satisfying $Q$ and every $s$ with $\\Re s>1/2$.",
