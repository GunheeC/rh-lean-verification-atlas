  "statement": "Assume Poitou--Tate duality, local finiteness and local Tate duality\nin the coefficient models for W05, the class-rank bound W11 and W05.\nThere are functions $R_0(M),R_\\ell(L)$ with values in $\\mathbb N$\nand a real $c>0$ such that the following works for every $C_t\\ge1$.\nTake an abelian field datum $M$ of modulus $m$, a finite set $B'$ of\nodd primes with abelian data $L_\\ell$ containing $\\mu_\\ell$, a real\n$A_1$ and $0<\\varepsilon<1/52$. Set\n\\[\n R=R_0(M)+\\sum_{\\ell\\in B'}R_\\ell(L_\\ell),\\qquad\n J=2^{R+2}(2cC_t/\\varepsilon)^R .\n\\]\nThere is $X_0$ uniform in the integer functions $e,t$ satisfying,\nfor $x\\ge2$, $2\\le e(x)$, $2^{e(x)}\\le x^{A_1}$ and\n$2\\le t(x)\\le x^{C_t}$. For $X\\ge X_0$ and primes $q\\equiv3\\pmod8$,\n$d\\equiv7\\pmod{16}$ with $(qd,m)=1$ and\n$\\log(qd)\\le X^{\\varepsilon/(4J)}$, there exists $Y$ with\n$X^{1/J}\\le Y$ and $Y^2\\le X$. At every $x\\in[Y,Y^2]$ the sum over\n$1\\le k<t(x)$ of the localization-kernel lengths is finite term by term\nand at most $\\exp(x^{4\\varepsilon/5})$ in each of two settings:\nat $2$ in every field of type $(M,e(x),q,d)$, and at each\n$\\ell\\in B'$ in every cyclotomic layer over a model of $L_\\ell$\nof degree $\\ell^{\\operatorname{Nat.log}_\\ell(R_\\ell(L_\\ell))+3}$.\nThe integer logarithm at zero is zero. The field type uses the fixed\ngroup in \\nodeid{P013} with the defining kernel of $M$ in place\nof $\\ker\\chi$.",
