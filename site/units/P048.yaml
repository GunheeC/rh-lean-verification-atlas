  "statement": "Take a base and pre-chart, an admissible column record \\(I\\) with its pinned frames and coefficients, its stage laws \\(l\\), later chart data and the level-zero lattice identification. Assume that the reference and twisted rows on this choice are integral. Choose the coefficient and tuple data with \\(t_p.\\xi=I.\\xi\\), and any divisor datum \\(Y\\). Under the stabilizer-denominator identity, for every word \\(u\\), used nonreference place tuple \\(\\mu\\), integral point \\(x\\) of the twisted point lattice and \\(F\\) in the indicated ambient carrier and \\(V_0(\\mu)\\), there exists \\(y\\in L_L\\) such that its chosen complex image is the twisted period of the embedded \\(x\\) and the identified \\(F\\), and for every \\(w\\) with \\(p_w\\notin Q_Y(\\mu)\\),\n\\[\n       y=0\\quad\\text{or}\\quad v_w(y)\\ \\ge\\ -e_w v_{p_w}(D_{\\Gamma,u}).\n\\]",
