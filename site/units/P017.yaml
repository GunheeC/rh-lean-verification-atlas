  "statement": "Let $\\mathcal L$ be a level. For all $e_D,e_L\\in\\mathbb R$, $\\varepsilon>0$, and every family $F$ at $\\varepsilon$ satisfying \\code{EFamC}$(\\mathcal L,F)$, suppose there exist $K,c_{HH},e_K,C_L,x_0\\in\\mathbb R$ such that at every $x\\ge x_0$ in $\\mathrm{Win}(F)$ the condition \\code{ChainTied}$(F;e_D,e_L,K,c_{HH},e_K,C_L;x)$ holds. Then some $x_1'$ satisfies\n\\[\n \\mathcal G_{\\mathcal L}(x)\\le x^{1/2+(e_D+e_L+7)\\varepsilon}\n \\qquad(x\\in\\mathrm{Win}(F),\\ x\\ge x_1').\n\\]",
