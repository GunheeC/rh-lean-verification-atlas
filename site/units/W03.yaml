  "statement": "Given the rank-$n$ literature record and W04, there is a common\nrecord $H'$ with the following fifteen fields. It retains the rank-$n$\ninput, supplies the cohomological, conjugation and Borel-injectivity\nassertions, and attaches Galois representations in rank two over totally\nreal fields. It supplies strong multiplicity one, the Gelfand--Kazhdan\nduality, admissibility, quadratic base change and the newform\nrealization on the real side. Its last five fields give weak unitary\ndescent, the cyclic base-change and rank-two descent conditions,\ndefinite quaternionic existence and semisimplicity of the real cuspidal\nrepresentation.",
