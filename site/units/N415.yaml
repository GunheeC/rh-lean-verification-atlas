  "title": "Relative prime count in progressions",
  "track": {
    "primary": "analytic",
    "secondary": []
  },
  "statement": "For $M>0$, $8\\mid M$, reduced $a\\bmod M$, $X\\ge2$ and $\\log X\\ge C_0\\log M\\log(\\log M+2)$, the prime count has main term $\\bigl(\\mathrm{li}_2(X)-\\chi(a)\\mathrm{li}_2(X^\\beta)\\bigr)/\\varphi(M)$ with relative error $\\ll e^{-c\\log X/\\log M}+e^{-\\sqrt{c\\log X}}$. The character term is omitted if the exceptional window is empty. Chapter T derives the relative error and exceptional-window adjustment from Thorner--Zaman.",
  "assumptions": [
    "source:blueprint_v13"
  ],
  "hypothesis_details": [
    "Use a reduced residue class modulo a positive multiple of eight.",
    "The endpoint satisfies $X\\ge2$ and $\\log X\\ge C_0\\log M\\log(\\log M+2)$."
  ],
