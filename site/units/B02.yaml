  "statement": "Fix a CM field and coefficient data as above, odd rank $a$, admissible field\ndatum $d$ and $x\\in E$ with $x^2=-d$. Fix the nonsplit exceptional set $T$,\nseparated places $w_0,v'\\mid\\ell$ agreeing on integral elements of\n$\\mathbb Q(x)$, and a finite set $S$. Let $U$ satisfy the automorphic\ncondition off $T$, the specified $\\ell$-type at $w_0$, the spherical condition\noff $w_0,S$, and the Satake-existence and lacunary-weight conditions at $v'$.\nThen there exists a continuous semisimple $\\rho$ of some dimension with\nthe source's Satake polynomial condition off a finite set of admissible\nplaces away from $\\ell$, and a Hodge-jump witness containing $a$ lacunary\nintegers. Call these common properties $V(\\rho)$.\nAt each such admissible $w\\nmid\\ell$ with Satake data one can insist on\n$V(\\rho)$ and the polynomial condition at $w$ for every Satake multiset\nthere. At each $w\\mid\\ell$ agreeing with $v'$ on $\\mathbb Q(x)$, separated\nfrom $w_0,v'$ and having Satake data, the following two witnesses exist:\none has $V(\\rho)$, crystalline comparison and the prescribed weight jumps\namong its jumps at $w$; another has $V(\\rho)$ and, for each Satake datum\nand inducing bridge, crystalline comparison and a degree $-1$ Weil element\nwhose characteristic polynomial divides a power of the Satake polynomial.\nThe dimension and representation may vary with the demanded witness.",
  "assumptions": [
    "source:paper2_v3"
  ],
