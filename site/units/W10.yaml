  "statement": "Assume $H'$, W05 and the reduced unitary rank-three lifting input.\nOver a model of $\\mathbb Q(i)$ this input selects, for each host frame, a\nmarked element at which the weight-zero piece of every universal lift\nis module-finite and each Type~I specialization satisfies the prescribed\nautomorphy clause of weight $-1$. For every $\\chi$ there is $C\\in\\mathbb N$\nsuch that the individual finite-length bound of W09 holds for each large\nhost, closure, coefficient ring, $0<e<t$ and $\\psi\\in X_h(O,e)$\nsatisfying $\\ell$ odd, $\\ell\\in B_\\chi$, $e=1$ and\n\\[\n R_1=16\\,\\operatorname{ord}(\\chi)(\\ell\\operatorname{cond}(\\chi))^2\n            4^{n_0}\\le 2^{c_2(\\psi)}.\n\\]\nHere $c_2$ is the exponent of $2$ in the conductor of the local\n$2$-component of $\\psi$, and $n_0=v_2(\\ell^{f_0}-1)$, with $f_0$ the\norder of $\\ell$ modulo the least common multiple of $4$ and the order\nof the prime-to-$\\ell$ part of $\\psi$ stripped of its $2$-component.",
