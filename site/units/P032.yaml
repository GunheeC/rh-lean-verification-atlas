  "statement": "Assume functoriality and the boundary identities for chains and prisms,\nthe prism composition law, the specified basic bar cycle and its\ncoefficient relation, the interpolation distribution, and the Steinitz\ntransport hypothesis. In any layer as above take \\(E=e+1\\), \\(e\\ge0\\),\n\\(m=2E+1<\\ell^c\\), and \\(a=\\kappa^E\\). For any \\(\\alpha\\in F^\\times\\)\nsatisfying the difference condition there are \\(N\\), a degree-\\(m\\)\nbar cycle \\(y\\) on \\(\\mathrm{GL}_N(\\mathcal O_L)\\) over\n\\(\\mathbb Z/q\\), and \\(0\\ne b\\in\\mathcal O_F\\) such that the following\nholds. For every reduction \\(r:\\mathcal O_F\\to k\\) to a finite field\nwhich is onto on \\(\\mathcal O_L\\) and has \\(r(b)\\ne0\\), for every\ncharacter \\(v:k^\\times\\to\\mathbb Z/q\\), and for every additive\nevaluating family \\(\\theta\\) satisfying the scalar law for \\(r(\\zeta)\\),\nthere is a residue \\(u\\in k^\\times\\) of \\(N_a(\\alpha)\\) for which\n\\[\n \\theta\\bigl(\\operatorname{red}_r y\\bigr)=\n \\prod_{\\substack{0\\le j<m\\\\j\\ne E}}(a-\\kappa^j)\\,v(u)\n \\quad\\text{in }\\mathbb Z/q.\n\\]",
