  "statement": "Under the convergent unitary Siegel-Weil formula, one can choose counting constants as a function of the output list and a positive constant bounded by its c-component, with nonnegative C-component and exponent at least 2(CYL+1). The same choices give the counting estimate for every family and test predicate.\n\\[\n\\exists c_{30},\\ \\exists c_{\\rm Ic}>0:\\ \\forall F,P,\\quad C_F\\ge0,\\quad A_F\\ge2(\\mathrm{CYL}_F+1),\\quad c_F\\ge c_{\\rm Ic},\\quad\\operatorname{CountAllPointsClass}(P,F,n_{0,F},A_F,C_F,c_F,cb_F).\n\\]",
