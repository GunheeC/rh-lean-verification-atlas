  "statement": "Assume the chain, prism, prism composition and basic-cycle identities,\nthe transfer of scalar functionals and the scalar cocycle formula.\nFor any finite field \\(k\\), positive integer \\(q\\), \\(e\\ge0\\),\nprimitive \\(q\\)-th root \\(\\zeta\\in k^\\times\\), and character\n\\(v:k^\\times\\to\\mathbb Z/q\\), there is an additive evaluating\nfamily \\(\\theta\\) of degree \\(2e+3\\). For every finite \\(k\\)-vector\nspace \\(V\\), every \\(x\\in\\mathbb N\\), and \\(g\\in\\mathrm{GL}(V)\\),\n\\[\n \\theta_V\\!\\left(P_g((j\\mapsto\\zeta^{xj}I_V)_*z)\\right)\n = x^{e+1}v(\\det g).\n\\]\nHere \\(P_g\\) is the conjugation prism, and \\(z\\) is the specified\ndegree-\\(2e+2\\) cyclic bar cycle.",
