      "step_texts": {
        "S1": "The factorial-normalized exponential kernel has an explicit full integral and upper bound for its value at each point.",
        "S2": "Choosing a Taylor order proportional to the left endpoint makes the lower and upper tails outside the logarithmic window exponentially small.",
        "S3": "On the window the positive part of the real integrand is bounded by its majorant, and off the window the growth assumption and the tail estimate control the remaining contribution.",
        "S4": "A nearest-pole dichotomy gives either a centre with room to isolate a nonreal obstruction or a positive-residue real pole as the nearest obstruction.",
        "S5": "In the separated-centre case the coefficient forced by the unique nearest pole exceeds the allowed Taylor-coefficient upper bound for sufficiently large order.",
        "S6": "In the real nearest-pole case positivity of the residue gives the incompatible sign and size in the coefficient bound.",
        "S7": "For real g the quantity |g|+g is at most twice the nonnegative majorant on the selected window.",
        "S8": "The exponential growth condition controls the integral on the two complementary tails at the selected Taylor order.",
        "S9": "After moving the centre to isolate a nearest pole, the two coefficient estimates are incompatible for large order.",
        "S10": "If the nearest pole is real, its signed principal part and the analytic remainder also contradict the same upper estimate."
      }
