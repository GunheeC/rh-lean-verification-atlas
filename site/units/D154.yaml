  "summary": "A hyperplane cuts the original cycle into components with multiplicities. Specializing one block of the Chow form records exactly those components as factors. The scalar ambiguity is harmless for this factorization, but the multiplicities and the requirement that the hyperplane avoid the original prime are essential."
