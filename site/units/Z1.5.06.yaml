  "statement": "CountQAlt and NewAdmAlt give absolute constants $c,A$. In particular, over every number field, for $e,M$ positive and $p$ away from $M$, the inverse Frobenius at $p$ raised to the given power has a trace classifier for Adm2B of size at most $c[M(e+1)]^A$. It works for every odd coefficient prime unequal to $p$.",
