  "statement": "Assume the third-place and theta-local records $P,Q$, agreement of the theta integrals, local matching and the covolume bound. Fix any proof $h_L$ of the proposition \\nolinkurl{UpperTheory.Zero.LLC.RecTExists}. Suppose that for every real $c$ the closed family bound at two and three gives the linked slot-norm assertion at \\nolinkurl{parametersOfDependence}$(h_L,c)$. Then there exists one record \\nolinkurl{HypsAlt}$(N,D_*)$, where $D_*$ is \\nolinkurl{DefiniteSideCondition} and $N(\\mathcal C)=\\mathrm{Closed}(\\mathcal C,(F_m,H)\\mapsto\\mathrm{LinkN}(F_m))$. Its family class, raw selection and threshold function support the existence, row, period, spectral, mass and norm certificates together. The proof uses the same maximum of the grid and Fourier-fit thresholds for the linked rows. The predicate \\nolinkurl{RecTExists} asserts the existence, for each number field with algebraic closure and each place with an extension over it, of a map satisfying \\nolinkurl{IsRecT}. The quantified argument is evidence for this existence proposition. See \\nolinkurl{nonempty_hyps_definite_side_of_closed_bound} (SiegelEisensteinSecondTermHypotheses.lean:44–68) and \\nolinkurl{RecTExists} (IsRecTOfIsRec.lean:78–80).",
  "assumptions": [
