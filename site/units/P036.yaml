  "statement": "Take a layer \\(F/L\\) with \\(L\\) totally complex, \\(E\\ge1\\),\n\\(a=\\kappa^E\\), and \\(b,B\\in\\mathbb N\\). Suppose every finite family\nof elements of \\(F^\\times\\) satisfying the divisor difference condition,\nwith pairwise distinct classes of \\(N_a(\\alpha)^{\\ell^b}\\) modulo\n\\(q\\)-th powers, has size at most \\(B\\). Let \\(\\mathcal H_q\\) consist\nof the functions on the prime ideals of \\(F\\) with values in\n\\(\\mathbb Z/q\\) that kill principal divisors and satisfy\n\\(\\phi(\\gamma^{-1}P)=a\\phi(P)\\). Writing \\(v=v_\\ell(E)\\) and\n\\(g=2[L:\\mathbb Q]+\\lfloor\\log_2 h_L\\rfloor+2\\), we have\n\\[\n \\mathcal H_q\\text{ finite},\\qquad\n |\\mathcal H_q|q^{r_2(L)}\n       \\le B\\,\\ell^{(b+v)g+c+v}.\n\\]",
