  },
  "statement": "For totally complex $L$, the torsion in $H_m(\\mathrm{GL}_N(\\mathcal O_L),\\mathbf Z)$ is finite. With $n=[L:\\mathbf Q]$, $D=|\\mathrm{disc}\\,L|$, $E\\ge1$, $1\\le N\\le4E+6$, and $m\\le2E+1$, its log order is at most $(2D)^{(2En)^{24}}$.",
  "assumptions": [
    "source:blueprint_v13"
  ],
  "hypothesis_details": [
    "Fix a totally complex field $L$.",
    "The quantitative assertion uses $E\\ge1$, $1\\le N\\le4E+6$ and $0\\le m\\le2E+1$."
