  "statement": "Assume $P$ and row rationality: every datum in the starting row test with the\nprescribed group, geometric, weight and residue-characteristic conditions passes\nthe rational row test. Fix a proof $h_L$ of the placewise local-map existence proposition \\nolinkurl{RecTExists}, $c\\in\\mathbb R$, and an\neventually large retwisting predicate $A$. Suppose the small-prime norm bound\nis linked at $p(h_L,c)$, and the functional inequality of T10 and covolume\ninequality of T13 are linked in their row versions at $p_A(h_L,c)$.\nThen the definite-side family, selection and certificates of T02 exist.\nThe two types of parameter have distinct roles in this implication.",
