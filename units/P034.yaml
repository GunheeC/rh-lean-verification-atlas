  "statement": "Let \\(L\\) be totally complex, \\(k\\ge0\\) even, \\(q=k+1<r_2(L)\\), and\n\\(n\\ge2q+4\\). Fix any integer \\(t>0\\). Starting with \\(z_0(x)=x\\)\nin \\(H_q(G_n,\\mathbb Z)\\), define\n\\[\n z_{j+1}(x)=(\\operatorname{diag}_t)_*z_j(x)\n                 -t^{j+2}\\operatorname{stab}_*z_j(x),\n\\]\nwhere block repetition and stabilization both land in rank \\(t^{j+1}n\\).\nThe integral span of all \\(z_k(x)\\) has rank at most \\(r_2(L)\\).",
