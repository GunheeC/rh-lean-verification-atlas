  "statement": "Assume that at \\(\\pi\\) the family is the integral block sum of \\(\\rho_\\pi\\) and the specified characters, that all coefficient functions of \\(\\det(1-zr(g))\\) belong to \\(T\\), and that the residual values of \\(\\rho_\\pi\\) span the whole matrix algebra. Give the orthogonal idempotents \\(e_B,e_1\\) and the element \\(g_0\\) with a corner perturbation \\(s\\) satisfying the prescribed evaluation and distinct-root conditions. There exists an ordered cover \\(p:X'\\to X\\) with point \\(\\pi'\\), scalar algebra \\(T'\\), matrix algebra \\(R'\\), block evaluations, and the prescribed ring and character data, for which\n\\[\n v_{\\rm cc}(p(\\pi'))=\\operatorname{length}_O(O/\\mathfrak c_\\pi).\n\\]\nThe same \\(R'\\) is left Noetherian, its evaluations respect the \\(T'\\)-action, and its specialized block actions commute with \\(O\\) and respect both scalar towers. Its scalar cover has a spanning family independent on every fibre. Determinants of all matrix arrays over \\(R'\\) are values of functions in \\(T'\\), the distinguished specialization is block triangular and surjects onto each diagonal block, and the two rank-one operators satisfy the stipulated evaluated character and scalar identities. For each of the specified additive topologies on \\(K,R'\\) with the requisite continuous scalar actions and multiplication on \\(R'\\), every admissible system of rows and columns satisfies the universal length estimate. Specifically, write \\(L\\) for the congruence length, \\(b'_w\\) for the row quotient length, \\(h_w\\) for the local invariant loss, \\(j_w\\) for the column dimension and \\(m_w\\) for the column lift exponent. For \\(d=v_O(\\delta_O)\\), scalar-block inputs \\(s,\\mathrm{Sha}_k\\) in \\(O\\)-length units, invariant bound \\(H_0\\), and the auxiliary roots \\(\\zeta_w\\), it gives\n\\[\n\\begin{aligned}\n L\\le{}&\\sum_{w\\in R}b'_w+\\sum_{w\\in C}\\{a m_w+j_w(a m_w+d)+2d+h_w\\}\n       +s+\\sum_{0<k<t}\\mathrm{Sha}_k+a v_\\ell(h_E)\\\\\n &+ta c_B\\sum_{w\\in R}([E_w:\\mathbf Q_\\ell]+2)\n     +4(r+t)(|C|+1)d+t|C|H_0+t\\sum_{w\\in Q}v_O(\\zeta_w-1).\n\\end{aligned}\n\\]\nThe same data give \\(d=a\\sum_{0<k<t}(s_0+v_\\ell(k))\\le a(t s_0+v_\\ell(t!))\\). The universal estimate assumes the off-\\(Z\\) condition, finite-class row images, column lifts, dimensions, global and local cohomological bounds, and character restrictions specified in the display.",
