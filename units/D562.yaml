  "statement": "There is one nonnegative Cd such that for every finite additive group, arithmetic data and character functional, every nontrivial character satisfies the Lipschitz bound |Gpsi(y)\\ensuremath{-}Gpsi(z)| \\ensuremath{\\le} |y\\ensuremath{-}z|(log(max(y,z))+Cd+|ell(psi)|), and |Gz(y)\\ensuremath{-}Gz(z)| \\ensuremath{\\le} Cd|y\\ensuremath{-}z|, for y,z at least 1.\n\\[\n|G_\\psi(y)-G_\\psi(z)|\\le |y-z|\\bigl(\\log(\\max\\{y,z\\})+C_d+|\\ell(\\psi)|\\bigr),\\qquad |G_z(y)-G_z(z)|\\le C_d|y-z|.\n\\]",
