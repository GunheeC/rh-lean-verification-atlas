  "statement": "Let \\(O\\) be a discrete valuation ring with finite residue field, \\(A\\)\nan algebra graded by an abelian group, \\(x:A\\to O\\) a point vanishing on\n\\(A_j\\), and \\(F_i\\in A_j\\). Fix \\(0\\ne c\\in O\\). Suppose an\nadditive injection \\(D:M\\to\\operatorname{Hom}_O(A,O/(c))\\) kills all\n\\(F_i\\) at every value. Suppose each \\(D(\\mu)\\) is the reduction of an\n\\(O\\)-valued point derivation of weight \\(j\\) at \\(x\\). With the\nsaturated lattice as above,\n\\[\n \\operatorname{length}_O M \\le\n \\operatorname{length}_O(L_j/\\langle\\overline F_i\\rangle).\n\\]",
