  "statement": "For a number field with the required roots of unity and $\\ell$ prime, a single cyclotomic generator $\\gamma$ has exact level $c$ and the base contains a primitive $\\ell^c$-th root. For every $E\\ge1$ and every layer $L_m$, its localization-kernel invariant is the cokernel length of $x_{\\rm Tw}(E,\\gamma)^{\\ell^m}-1$.",
