  "statement": "Assume $F$, unramified Howe duality in its two spherical-span directions, and\nthe convergent unitary Siegel--Weil input. For each $\\varepsilon$ and\n$C_F\\ge6510$ some $x_0$ works for all size data of exponent $\\varepsilon$\nat $x\\ge x_0$ satisfying the row sizes and the Eisenstein tie. For every\ncompatible finite-group family, real datum with its level character and group\nrecord, grid $(1,C_F,b)$, Weil model above the datum, row volume and\nnonzero smooth vector $w$, there exist a real vector $\\rho$ and coefficient\nfunctional $\\xi$. For every nonzero $t$ in the trivial-character evaluation\nspace there are a column $\\Psi$ and grid datum $\\Phi$ for which the\npairing of the row form of $(w,t)$ converges and is nonzero.",
