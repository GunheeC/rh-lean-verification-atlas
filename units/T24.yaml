  "statement": "Fix a prime $p$, an algebraically closed\ncharacteristic-zero valued field $C$ with $v(p)<1$, a valuation ring $O$\nwhich is a $\\mathbb Z_p$-algebra complete for $(p)$, and a $p$-divisible\ngroup $G/O$. Choose $\\zeta_0=1$, $\\zeta_{n+1}^p=\\zeta_n$, $\\zeta_1\\ne1$.\nLet $B$ pair the two $O$-extended Tate modules of $G,G^\\vee$ bilinearly.\nOn pure Tate elements require the Weil pairing to be\n$a\\mu_{\\mathrm{Tate}}(\\zeta)$ and $B(1\\otimes x,1\\otimes\\chi)=a$ in $O$\nfor some $a\\in\\mathbb Z_p$, for every $x,\\chi$.\nThen $\\mathrm{HT}_G(x)=0$ if and only if $B(x,y)=0$ for all\n$y\\in\\ker(\\mathrm{dlog}_G)$ in the dual-side module.",
