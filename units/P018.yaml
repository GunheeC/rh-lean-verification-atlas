  "statement": "\\par\\noindent{\\footnotesize \\nolinkurl{Imports.lean:8}.}\\par\nLet $\\mathcal L$ be a level, $\\lambda>1$ and $0<\\theta<1$. If the set\n$\\{x:\\mathcal G_{\\mathcal L}(x)\\le x^{\\theta}\\}$ has windows of exponent $\\lambda$, then\n$\\mathcal L$ is zero-free above $\\theta$.",
