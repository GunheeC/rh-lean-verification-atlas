  "statement": "\\par\\noindent{\\footnotesize \\nolinkurl{ZeroFreeOfRpowWindow.lean:11}, \\nolinkurl{lemmaL.lean:13}, \\nolinkurl{WindowHypOfRpow.lean:27}, \\nolinkurl{WindowHypUOfWindowHyp.lean:29}.}\\par\nLet $F$ be a character family, $0<\\theta<1$, $\\delta>0$ and $C\\in\\mathbb R$. Assume that for every\n$Y_0$ there is $Y\\ge Y_0$ such that\n\\[\n\\mathcal G_F(y)\\le C\\,y^{\\theta}\\qquad\\text{for all }y\\in[Y,Y^{1+\\delta}].\n\\]\nThen $F$ is zero-free above $\\theta$.",
