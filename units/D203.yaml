  "statement": "For the specified p-adic field K, every element of the de Rham period ring fixed by all automorphisms of the p-adic algebraic closure over K is the image of an element of K.\n\\[\n\\forall x\\in B_{\\rm dR},\\quad (\\forall\\sigma\\in G_K,\\ \\sigma x=x)\\ \\Longrightarrow\\ \\exists k\\in K,\\ \\iota_K(k)=x.\n\\]",
