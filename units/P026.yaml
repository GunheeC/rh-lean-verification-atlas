  "statement": "Let \\(\\ell\\) be odd, \\(e\\ge1\\), \\(A\\) a place above \\(\\ell\\), and \\(W\\)\na continuous integral two-dimensional representation of \\(G_{\\mathbb Q}\\).\nAssume the specified normal form: \\(W\\) is unramified outside \\(S\\)\ncontaining the primes over \\(\\ell\\), its determinant \\(\\delta\\) has\nsquare one and takes value \\(-1\\) on complex conjugations, and its\nrestriction to \\(\\ker\\chi\\cap\\ker\\delta\\) is irreducible. At \\(A\\),\n\\(W\\) is upper triangular,\na positive power of its first diagonal character on inertia equals the\nsame power of \\(\\chi^e\\), and that character differs from \\(\\chi\\)\nsomewhere on the decomposition group. Let \\(g\\) be a newform of weight\n\\(2e+1\\), of level prime to \\(\\ell\\), with unit \\(a_\\ell(g)\\).\nSuppose there is a character \\(\\eta\\) trivial on the subgroup fixing\n\\(\\mu_\\ell\\) pointwise such that \\(g\\) is attached (via \\(\\iota\\))\nto \\(W\\otimes\\chi^{-e}\\delta^{-1}\\eta\\), and\n\\(W(s)_{22}\\chi(s)^e\\delta(s)^{-1}\\eta(s)=1\\) on inertia at \\(A\\).\nThere exist a common coefficient ring \\(O\\) for \\(W\\), an \\(O\\)-integral\ncontinuous cocycle \\(y\\), and a finite set \\(S'\\) with the following properties.\nOn inertia away from \\(\\ell\\), \\(y\\) is locally a coboundary.\nThere is no scalar \\(x\\) with \\(y(s)_2=(W(s)_{22}-1)x\\) throughout\nthe decomposition group of \\(A\\).\nFor every \\(n\\ge1,\\ w\\notin S',\\ \\ell^n\\mid Nw-1\\), and every admitted\nsurjective character to \\(\\mathbb Z/\\ell^n\\) trivial on the subgroup\nfixing \\(\\mu_{Nw}\\) pointwise, the same \\(y\\) satisfies the tame norm relation.",
