  "statement": "Let $n,n_T,n_{T,2},m$ be natural numbers and $C,\\varepsilon,x,b,k,a_E,\\mathrm{Err},G_x$ real. Assume the size-window inequalities, including $x\\geq3$, $n,b,\\varepsilon>0$ and the bounds on $m,k,a_E$ and $\\mathrm{Err}$ in the linked definition. If\n        \\[ n_T mb\\,\\frac{n_{T,2}}{2n}\\bigl(G_x-4x^{1/2+\\varepsilon}\\bigr)\n        \\leq \\mathrm{Err}+2n_T mb/x,\\]\n        then $G_x\\leq x^{1/2+(C+3)\\varepsilon}$.",
