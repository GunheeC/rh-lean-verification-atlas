  "statement": "Let \\(F\\) be a number field and \\(\\ell\\) a prime such that \\(\\ell\\ne2\\)\nor \\(F\\) has no real place. Assume finite-coefficient Poitou--Tate\nduality, local finiteness and local Tate duality. For every allowed\nset of local data \\(D\\) and every \\(e\\in\\mathbb Z\\), with\n\\(A_e=(\\mathbb Q_\\ell/\\mathbb Z_\\ell)(-e)\\),\n\\[\n \\operatorname{length}H^2(G_{F,S},\\mathbb Z_\\ell(e+1))\n      +\\nu_{\\rm Gal}(\\ell,F,|e|)\n   =\\operatorname{length}\\Sha^1(D,A_e)\n      +\\sum_{w\\in D.S}\\operatorname{length}H^0(F_w,A_e).\n\\]\nAll lengths are extended \\(\\mathbb Z_\\ell\\)-lengths;\n\\(\\Sha^1\\) is the kernel of the specified localization.",
