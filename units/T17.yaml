  "statement": "Take finite blocks of homogeneous coordinates $y$ in a field $\\Omega$,\ntheir vanishing ideal $P$, a birational presentation of arithmetic dimension\n$D+1$, and an intersection system $I$ satisfying its defining axioms.\nLet $A$ be a conjugation-invariant Hermitian line, semipositive relative\nto some $P_0\\subseteq P$, nef on the fibres in its multidegree and nef on\nthe generic fibre in the specified sense. Then\n\\[\n I_P(A^{D+1})\\le\n \\mathrm{arVolP}\\bigl(\\text{small sections for }P,y,A,\\,\n       \\mathrm{chartLat}(y,\\deg A),1,D\\bigr).\n\\]",
