  "statement": "Assume the eight statements T17--T24. There is a real $C\\ge0$ uniform in\nthe following data. Let a core $T$ on $D$ satisfy the core laws and\n$m^2\\le k$. Take $1\\le j<m$, a deep datum $Y$ of index $j$, an integer\n$e\\ge0$ and a real $o$ with $Y$ good at $(e,o)$. Suppose its integer\n$M'$ has at most fifteen distinct prime factors. For each admissible\nweight $u$ with gap $g>0$, there are real numbers $s_Z$, indexed by\ncomponents, such that\n\\[\n  s_Z\\le\\mathrm{compVolSlope}_{Y,\\xi_R,8,\\mathrm{mixVals}(B),Z}(u),\n  \\qquad\n  \\frac{\\sum_Z^{\\mathrm{fin}}s_Z}{\\#\\mathrm{Comp}}\n   \\ge -C\\,\\mathrm{errX}(\\ell(D),u,g),\\qquad B=\\mathrm{bndB}(u,g).\n\\]\nHere the weight decreases strictly at each embedding, and differences\nfrom each index on the $q$-side to any other index there or on the\n$p$-side have absolute value at least $g$.",
