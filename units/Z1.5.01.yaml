  "statement": "For each totally complex number field $E$ and rank $n$, there are constants $c,A$ such that for every strictly decreasing tuple with $|m_i|\\le H$ there is one algebraic coefficient representation with the negative of $\\mathrm{infOf}(m)$ at every embedding and dimension at most $c(H+1)^A$.",
  "assumptions": [
    "source:blueprint_v13"
  ],
  "hypothesis_details": [
    "Fix a totally complex number field and a rank.",
    "The integral weights strictly decrease and are bounded in absolute value by $H$."
