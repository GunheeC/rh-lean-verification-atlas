  "statement": "For a level $\\mathcal L$, fixed real $e_D,e_L,K,c_{HH},e_K,C$ and\n$\\varepsilon>0$ there exists $x_1$ such that, for every $x\\ge x_1$,\nframe, host on that frame and finite test set $TT$, the following two\nconditions imply\n\\[\n       \\mathcal G_{\\mathcal L}(x)\\le x^{1/2+(e_D+e_L+7)\\varepsilon}.\n\\]\nFirst, the host and level have the same order $o$, represent every kept\ncharacter in the positive family, and agree on the distinguished\nquadratic character's exceptional status. Each translate of the subgroup\n$A_0$ has a share of $TT$ within $x^{-1+\\varepsilon}$ of its target\n($4/(3o+1)$ for $A_0$ and $3/(3o+1)$ otherwise, in the equivalent\nunnormalised counting inequality). For the positive-family characters\noutside the kept set and all negative-family characters the bounds are\n$|G_\\chi(x)|\\le x^{1/2+\\varepsilon}$ and $|(L'/L)(1,\\chi)|\\le C\\log x$.\n\nSecond, there are finite unit and word data, with nonempty word fibres,\na map onto every element of $A_0$, and arithmetic coefficients whose\nnontrivial character logarithmic derivatives agree with the host's.\nThey identify the lattice top and place indices with $TT$ and the\nindex-two subgroup, and satisfy the lattice hypotheses, error-window\nand $B_0,N_c$ bounds in \\hyperref[sub:B10]{B10} and the size, thin,\ncost and remaining-size conditions in \\hyperref[sub:B09]{B09}, with\n$T_2\\subset A_0$. The scale and exponent of the lattice data are\n$x,\\varepsilon$; their division, loss and height exponents are bounded\nabove by $e_D,e_L,c_{HH}$ respectively.",
