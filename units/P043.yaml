  "statement": "Work on the normalized family \\(r_N\\) with its ring record and evaluation, topology, scalar and rank identifications. Assume G2 (local gain bound and crystalline twist), G4 (unramified away from the specified sets), G5 (inertia polynomial relations), tame generators, semisimple decomposition, Fontaine conditions above \\(\\ell\\), local Tate \\(H^1\\) finiteness, and local coefficient compatibility. Assume goodness of the self coefficient extension, the specified auxiliary character powers, and \\(TB(c_B)\\) for \\(r_N\\). On these same data the following hold.\n\\begin{enumerate}\n\\item Block zero satisfies the fixed \\(\\rho\\)-block conditions for the determinant presentation.\n\\item For \\(c\\ge1\\), each admissible projected row cocycle is finite after multiplication by \\(\\ell^{c_B}\\); the colength of the finite condition in its locally constant \\(\\ell^{c_B}\\)-division part is at most \\(ac_B([E_w:\\mathbf Q_\\ell]+1)\\).\n\\item All higher character blocks \\(c\\ge2\\) satisfy their character local conditions.\n\\item The first character block obeys its specified inertia and auxiliary-prime local conditions.\n\\item The row subquotient, orbit, matrix-lattice and target orbit continuity conditions hold simultaneously.\n\\end{enumerate}",
