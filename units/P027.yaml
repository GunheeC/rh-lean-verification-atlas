  "summary": "Under the graded-chart, fibre and tangent-space hypotheses, finitely many two-sided points meet every two-sided orbit. Twice the sum of valuations of a separating function on any such cover bounds the indicated cotangent quotient length. This converts a local algebra length into a finite orbit calculation."
