  "statement": "Let \\(O\\) be a complete characteristic-zero discrete valuation ring and\n\\(K\\) an algebraically closed extension of its fraction field with\nvaluation \\(v\\) extending the normalized order. Let \\(A=\\bigoplus_j A_j\\)\nbe graded, with marked \\(O\\)-point \\(x\\) zero on nonzero weights.\nIts degree-zero algebra is Noetherian, complete local, with local\nstructure map surjective on residue fields. It generates \\(A\\) together\nwith finitely many elements of weights \\(-2,-1,1,2\\).\nLet \\(I\\) be generated by lists of weights \\((-1,-2,1,2,0)\\) and sizes\n\\((r+1,s,r',s',m)\\); denote the first list by \\(F\\), and assume the\nweight-zero equations vanish at \\(x\\). Put\n\\[\n P=\\{b\\in A:\\,tb\\in(\\ker x)^2\\text{ for some }0\\ne t\\in O\\},\n \\qquad L_j=\\operatorname{im}(A_j\\cap\\ker x\\longrightarrow A/P).\n\\]\nAssume \\(r\\ge1\\) and the smooth graded chart \\(M_1\\): its variable\ncounts in the five weights are \\((r,s,r'+1,s'+1,m)\\); individual\nlinear coordinates can be isolated, and vanishing of the linear\npart on \\(\\ker x\\) implies membership in \\(P\\). The negative and\nweight-zero equation lists span the corresponding cotangent lattices\nover the fraction field. Assume the image of \\(A_0\\) in \\(A/I\\)\nis finite over \\(O\\). In what follows take \\(K\\)-points of \\(A/I\\).\nFor each point vanishing on both signs other\nthan \\(x_K\\), at least one strictly one-sided sign is absent in its\nfibre over \\(A_0\\). At every two-sided point (nonzero on some element\nof each sign), point derivations killing \\(I\\) have dimension at most\none. Let \\(a\\in A_0\\) vanish at \\(x\\) and be nonzero at all two-sided\npoints. There exists a finite set of two-sided points meeting every\nsuch \\(K^\\times\\)-orbit. For every such cover \\(T\\),\n\\[\n L=\\operatorname{length}_O(L_{-1}/\\langle\\overline F_i\\rangle)\n <\\infty,\\qquad L\\le 2\\sum_{\\xi\\in T}v(\\xi(a)).\n\\]",
