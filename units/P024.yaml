  "statement": "Assume the automorphic hypotheses \\(H'\\) together with weak descent,\ncyclic base change and quadratic descent, the specified quaternion\nexistence theorem, and real semisimplicity of the cusp data.\n\\begin{enumerate}\n\\item For every admitted CM field \\(K\\), coefficient ring, nonzero level,\nweight parameter, character and marked datum \\(D\\), every\n\\(\\iota:\\overline{\\mathbb Q}_\\ell\\simeq\\mathbb C\\), and every valuation\nabove \\(\\ell\\), there is a single \\(g_1\\) satisfying the marking equations\nfor \\(D\\), the finiteness condition \\(\\mathrm{FinEnd}\\), and both automorphic\nend conditions, of ranks three and two respectively.\n\\item Suppose also that \\([K:\\mathbb Q]=2\\) and \\(K\\) contains a root\nof \\(X^2+1\\). For every admitted host datum and host frame \\(F\\) there\nis a marked \\(g_1\\) such that for each universal representation \\(u\\)\nat that mark, its weight-zero part is finite as a module over the\ncoefficient ring. At every Type~I specialization \\(r\\) of \\(u\\), the\nindicated matrix representation satisfies the prescribed\nautomorphy condition over \\(K\\) with twist \\(-1\\).\n\\end{enumerate}",
