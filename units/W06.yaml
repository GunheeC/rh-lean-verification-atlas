  "statement": "Assume $H'$. For every algebraic closure of $\\mathbb Q$, large host\n$(h,t)$, odd prime $\\ell$, coefficient ring $O$, $0<e<t$,\n$\\psi\\in X_h(O,e)$ and good rank-four symplectic datum $D$ in \nCase~II or III of W09, the following hold. Here the datum has character\n$\\psi$, ramification set the primes dividing $2\\ell Np_1$, and an odd\nauxiliary character built from a primitive character at $2^{n'}$ and\none of order $m_0$ at $p_1$. The prescribed $(n',p_1,m_0)$ is\n$(n_{\\rm II},1,1)$ in Case~II and\n$(n_{\\rm III},p_1(\\chi),\\operatorname{ord}\\psi)$ in Case~III.\nThe goodness conditions fix the places, inertia and parity of the\ncharacters, a lift of the mod-$\\ell$ cyclotomic character of exponent\n$\\ell-1$, distinguished Frobenius elements and their residual\nseparation, and vanishing of the locally trivial residual cocycles for\n$\\alpha,\\beta,\\theta$ and their inverses. They include the distinguished\nlimit, the nontriviality of $\\bar\\alpha$ and $\\bar\\Psi$ on $g_0$, and an\ninertial $s_0\\in\\ker\\psi\\cap\\ker\\omega$ of infinite cyclotomic order.\nFor every lift satisfying\nthe imposed component conditions, its weight-zero monomials generate a\nmodule-finite $O$-algebra. At any geometric point with block image the\nblocks indexed by $\\{0,2\\}$ span a proper subspace of $M_2$.\nThere is one $\\iota:\\overline{\\mathbb Q}_\\ell\\simeq\\mathbb C$ for\nall irreducible geometric points. Whenever such a point is continuous\nand stays irreducible on restriction to a quadratic CM field, that\nrestriction is attached via $\\iota$ to a regular algebraic cusp form\nand has the local witness of W07.",
