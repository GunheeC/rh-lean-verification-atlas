  },
  "statement": "In a cyclic layer with $2e+3<\\ell^c$, any $\\alpha$ satisfying the divisor condition gives a degree-$(2e+3)$ cycle over $\\mathcal O_L$ with coefficients modulo $\\ell^\\nu$ and a single nonzero denominator. At every allowed residue map, every additive evaluator with the prescribed scalar value returns $P_{e+1}v(u)$ for a residue $u$ of the twisted norm, with $P_{e+1}=\\prod_{0\\le i<2e+3,\\ i\\ne e+1}(\\kappa^{e+1}-\\kappa^i)$ and $\\kappa=1+\\ell^c$. A primitive reduced root supplies such an evaluator.",
  "assumptions": [
    "source:blueprint_v13"
  ],
  "hypothesis_details": [
    "Use a cyclic layer with $2e+3<\\ell^c$ and an element satisfying the divisor condition.",
    "The residual maps and evaluators satisfy the stated scalar conditions."
  ],
