  "statement": "Let \\(O\\to O'\\) be a finite free extension of coefficient DVRs with \\(v_{O'}(x)=e v_O(x)\\). Use two evaluated splitting algebras attached to compatible matrix data satisfying the distinct-eigenvalue corner hypothesis, their defining identities, Noetherianity and the prescribed scalar actions. If \\(M\\) over the first matrix algebra \\(R\\) has \\(g\\) specified generators, there is an \\(R'\\)-module \\(M'\\) on \\(g\\) generators such that for every \\(Z\\subseteq X\\), nonzero evaluation Hom at every point above \\(X\\setminus Z\\) downstairs implies the corresponding nonvanishing upstairs. For every distinguished block \\(k\\),\n\\[\n \\operatorname{length}_{O'}\\operatorname{Hom}_{R'}(M',V'_k)\n   = e\\,\\operatorname{length}_{O}\\operatorname{Hom}_{R}(M,V_k).\n\\]\nLengths are extended natural numbers, and the \\(V_k\\) are the specialized torsion coefficient blocks.",
