  "statement": "Assume the two-layer linkage hypotheses. For every proof $h_L$ of the placewise local-map existence proposition \\nolinkurl{RecTExists} and every parameter record $p$ over $h_L$, the following closed family assertion satisfies the\nlinked norm condition at $p$. There exist $C,x_0$ such that at all\n$x\\ge x_0$, $x>x_1$, and each index, for every compatible local\n$HW,F$ with its comparison and every hub $X,C_2$ satisfying the specified\nsetup, the bound holds at each twisted place $i$ with $l_i=2$ or with\n$l_i=3$ and $3$ outside the host's small set. For every good $\\pi$ it reads\n\\[\n \\begin{aligned}\n v_{cc}(i,\\pi)&\\le s_\\pi(\\rho_i)+\\mathrm{midF}(L,C)\n       +\\mathrm{VVr}(l_i)+v_{hE}(l_i)+\\varepsilon_L(l_i),\\\\\n \\mathrm{midF}(L,C)&=C f m b\\log x+C x^C\\mathrm{large}_2(L)^2 .\n \\end{aligned}\n\\]",
