  "statement": "For every totally complex number field \\(L\\) and \\(N,m\\ge0\\), let\n\\(d=[L:\\mathbb Q]N\\), \\(s=3^{dN}\\), and \\(A=\\mathrm{orbBound}(L,N,m)\\),\nthe uniform face-orbit bound of the integral Hermitian complex through\ndegree \\(m\\). Then \\(T=H_m(G_N,\\mathbb Z)_{\\rm tors}\\) is finite with\n\\[\n                    |T|\\le(m+2)^A s^{m A s^m}.\n\\]",
