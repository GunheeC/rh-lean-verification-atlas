  "statement": "Assume the automorphic hypotheses and $\\mathrm{LevelPNAlt}$. For each imaginary quadratic field $K$ and $n\\ge2$ there are $c,A$ such that for all strictly decreasing weights $m$ with $|m_i|\\le H$ and $m_i+m_{\\mathrm{rev}(i)}=\\mathrm{wt}$, levels $M\\ge1$ and places $w\\mid p$ with $p\\nmid M\\,\\mathrm{disc}(K)$, there is a single Frobenius classifier $D$ over $w$ of size at most $c[M(H+1)]^A$ for every allowed $\\mathrm{AdmPNAlt}$ system at every odd coefficient prime $\\ell\\ne p$.",
