  "statement": "On the enriched class D3(3,A), duty, tied real-place second-layer data, the mass-ratio estimate and the genus-mass hypotheses give two uniform implications. Chosen data of exponent 3 give fullness and the prescribed degree/rank relation. Tuple and discriminant-size bounds give the global comparison with constants 2, CH, 3, 2, 0.\n\\[\n\\mathrm{ChosenE}(F,3,C_H)\\Rightarrow\\mathrm{NuFullF}(F)\\wedge\\mathrm{MuRank}(F),\\quad \\mathrm{TuSize}(F)\\wedge\\mathrm{DGamSize}(F)\\Rightarrow\\mathrm{LinkGLOBAL}(F,2,C_H,3,2,0).\n\\]",
