  "statement": "Let epsilon in the tilt have untilt 1 and suppose the untilt of its inverse Frobenius is different from 1. If y in the positive crystalline period ring has zero de Rham theta image after every nonnegative Frobenius iterate, then the Frobenius of y is a multiple of the image of the crystalline period t(epsilon) in that ring.\n\\[\n\\bigl(\\forall n\\ge0,\\ \\theta_{\\rm dR}(\\iota(\\varphi^n y))=0\\bigr)\\ \\Longrightarrow\\ \\varphi y\\in\\bigl(t(\\varepsilon)\\bigr)B_{\\rm cris}^{+}.\n\\]",
