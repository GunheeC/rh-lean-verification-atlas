  "summary": "If every Frobenius iterate of a positive crystalline period has zero theta value after comparison, its Frobenius image is divisible by the chosen period in the positive crystalline ring. The proof clears a denominator, proves integral divisibility with an extra factor of $p$, and then removes that factor in the localized ring."
