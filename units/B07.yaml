  "statement": "For each primitive character $\\psi$, assume the bound of\nSection~\\ref{sec:mechanism} at $t=\\lfloor x^{401}\\rfloor$ with the\nquantifiers of $V$ for this $\\psi$. For every $0<\\varepsilon<1/52$\nthere are $C_{T2},C_8,C_5,c_6,C_b,x_0$ with $C_8\\ge1$ and\n$C_5,c_6,C_b>0$, and a system of scales with exponent-$3/2$ windows.\nAt each eligible scale $s$ with $s.\\varepsilon=\\varepsilon$ and\n$s.x\\ge x_0$ there exist the specified ranks, a host with invariant\n$C_{T2}$, and an auxiliary prime parameter satisfying the rank and\nhost-size conditions. The character request at these data enforces the\nkept-character and share conditions for $\\operatorname{cyc}(\\psi)$,\nthe pointwise bounds on the other characters (logarithmic-derivative\nconstant $4$), and the finite-length Selmer bound with budget $\\sqrt b$.",
