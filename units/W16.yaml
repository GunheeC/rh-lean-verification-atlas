  "statement": "Fix a local parameter reading rule, an everywhere finite-unramified CM\nextension $E/E^+$, $n\\ge1$, an automorphic $\\pi$ on the unitary group,\na finite set $S$ and a comparison frame for $(\\pi,S)$. Choose local test\ndata and an auxiliary finite set $T'$ of nonsplit places disjoint from\nthe frame's initial set $S_0$ and its bad set. For each partition\nindex $i$ and each $w\\in T'$, the ordered pairs of joint Hecke\neigenvalue tuples of all candidate pairs lie in a finite set. For\neach $w\\in S_0$ a finite list of model products suffices. Every candidate\nproduct has the same irreducible subquotients and the same dimension\nof $K'_w$-invariants as one on the list, whose invariant space is\nfinite-dimensional. A single integer bounds, over all candidates and\nall $w\\in T'$, the dimension of the candidate pair's invariants under\nthe prescribed two-block subgroup $I_2$.",
