  "statement": "For each eligible CM subfield, procyclic local data and positive twist e, a power of the prime kills the minus kernel. Its exponent times log of the prime is bounded by C times the field degree, (e+1) and log(e times the prime times the conductor parameter).\n\\[\n\\ell^r\\Sha^{-}(D,e)=0,\\qquad r\\log\\ell\\le C[E:\\mathbb Q](e+1)\\log(e\\ell N).\n\\]",
  "assumptions": [
    "source:paper2_v3"
  ],
  "hypothesis_details": [
    "The CM field embeds into the indicated cyclotomic field of positive conductor $N$.",
    "Use procyclic local data at the chosen prime and an integral twist $e\\ge1$."
  ],
