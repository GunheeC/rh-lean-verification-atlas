  "statement": "Fix a prime \\(p\\) and project systems \\(X,Y,D\\). Assume the integral exponential factorization for the formal group (\\(\\mathrm{RestGc}\\)): in the indicated even cyclic coordinates, after adjoining a \\((p^2-1)\\)-st root of \\(p\\) and using the inverse Lubin--Tate parameter, the transformed exponential factors as the prescribed exponential times an integral series, with integral parameters. Assume each unweighted differential coefficient is zero or agrees with the corresponding coefficient of a local frame jet. If \\(D\\) admits \\(X,Y\\), then for any place \\(v\\), stage \\(j<m\\), \\(1\\le i\\le r\\), allowed integral parameter series \\(U\\), selected columns \\(I\\) and output monomial \\(n\\), the coefficient at \\(n\\) of the \\(i\\)-weighted differential of\n\\[\n \\Theta_j\\!\\left(\\exp(-\\Phi_{j,v})\\,U\\right)\n\\]\nsatisfies the lower valuation bound \\(g_v(j+1)\\) in the comparison field \\(Y\\). Integrality of \\(U\\) here is in the chosen parameter coordinates.",
