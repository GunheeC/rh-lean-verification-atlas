  "statement": "Assume $H'$. Fix an odd prime $\\ell$, $e\\ge1$ with $\\ell-1\\nmid2e$,\nan imaginary quadratic field $K$, an even positive level $N$ coprime to\n$D_K=|\\operatorname{disc}K|$, with $\\ell\\nmid D_K h_K$, and an\nalgebraic closure $\\Omega/\\mathbb Q$ containing $K$. Write\n$\\kappa$ for the cyclotomic character and $\\theta$ for the quadratic\ncharacter cutting out $K$. Take $\\psi$ and $W:G_{\\mathbb Q}\\to\n\\mathrm{GL}_2(\\overline{\\mathbb Q}_\\ell)$ satisfying the source\nconditions \\code{Used}. Explicitly, $\\psi$ factors through level $N$,\nhas prime-to-$\\ell$ order, has square one on inertia at $\\ell$, and\n$\\kappa^e\\psi$ is even. The representation $W$ has level datum\n$(ND_K;e,-e)$, the ordinary polynomial condition for $(e,-e)$, and\ndeterminant $\\theta$. On inertia at $\\ell$ its trace is\n$a+a^{-1}$ for $a=\\kappa^e\\psi$. Globally the residual trace is\n$\\theta a+a^{-1}$. At a chosen place above $\\ell$, inertia lies\nin $\\ker\\theta$ and the prescribed flag characters restrict to\n$\\kappa^{\\pm e}\\chi$ for a single character through level $\\ell$.\nThe restriction to $G_{K(\\mu_{\\ell^\\infty})}$ is irreducible.\nSuppose a weight-$2e+1$ newform realizes $W\\otimes\\kappa^{-e}$\nvia $\\iota$, and on every quadratic CM restriction on which $W$ is\nirreducible it has the witness \\code{WitA}: local unlinked flags\nabove $\\ell$ become power-unlinked, and each attached regular\nalgebraic cusp form has a common real parameter for its local window\naway from $\\ell$ and at the power-unlinked places. For both $W$ and $W\\otimes\\theta$, every cocycle satisfying the\nBloch--Kato local conditions is a coboundary.",
