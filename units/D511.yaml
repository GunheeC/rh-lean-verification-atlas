  "statement": "For each allowed epsilon and C0 at least 1, fix uniform host constants and a lower threshold. An admitted initial host of an admissible rank tuple, with the prescribed conductor and lcm divisibility, good prime pair in its window and field rows up to floor(Y\\textasciicircum{}(epsilon/5)), extends to a host at that scale and an auxiliary prime. It has the chosen constants, the four-parameter host bound, and character shares with tolerance x\\textasciicircum{}(\\ensuremath{-}1+epsilon).\n\\[\n\\exists H,q_0,\\quad H^{\\rm ax}=H_0,\\quad C_{T,2}(H)=C_{T,2},\\quad\\mathrm{HostGood}(s,C_8,4,c_6,C_b,H,q_0),\\quad\\mathrm{Shares}_{R}(TT_H,x^{-1+\\varepsilon}).\n\\]",
