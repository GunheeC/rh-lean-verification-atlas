  "statement": "Assume the doubling Eisenstein input (right-half-plane summation and\nmeromorphic continuation with moderate local regularizations) and the\nstandard value statement T12. Over every admissible number-field pair and\nautomorphism, each admissible triple of Weil models has real and finite\nmatching data. The unprimed integrals converge on Schwartz vectors. On\nthe prescribed primed test space the theta kernel has rapid decay in one\nvariable with polynomial growth in the other, the integral converges and is\nmoderate. For each matching choice some primed test integral is nonzero\nand there is a unique nonzero $c$ with $I(\\Phi)=c I'(\\Phi')$ for every\nmatched pair, as functions on the common group. At good places the kernels\nof both finite quotient maps are the augmentation spaces on the test vectors,\nthe primed local test spaces surject onto the quotient, and functionals\nkilling the primed augmentation factor on test vectors through the quotient.\nThe primed global test space is stable under the primed action.\n\nThere are two independent uniform triples of signs for the tower relations.\nFor two matching models with comparison constants $c,c_1$ and an adapted\npair of planes, $C\\ne0$ depends on the geometry and real maps. Write\n$F(z)$ for the signed \\nolinkurl{stepFac} of the two plane ideals and $L(z)$\nfor the source's \\nolinkurl{charL} of $\\nu,S_0$. In the $\\beta$ step,\nwith ranks $(a,b+2)$ and $(a,b)$ and $h=\\lfloor (a-b-2)_+/2\\rfloor$,\none has $cL(h+1)=u c_1$ for some $u$ such that $uCF(-h)=1$.\nIn the $\\alpha$ step with ranks $(b+2,a')$ and $(b,a')$ and\n$h=\\lfloor(b+2-a')_+/2\\rfloor$, one has $c=CF(1-h)L(h)c_1$.",
