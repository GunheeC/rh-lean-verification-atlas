  "statement": "Assume the automorphic hypotheses \\(H'\\) and the CM level and\nSatake--Frobenius correspondence \\(\\mathrm{LevelKNAlt}\\).\nFor each CM field \\(K\\) and \\(n\\ge2\\) there exist \\(c,A\\in\\mathbb N\\).\nLet \\(m_1>\\cdots>m_n\\) satisfy \\(m_i+m_{n+1-i}=1-n\\)\nand \\(|m_i|\\le H\\). Given \\(M\\ge1\\) and \\(w\\mid p\\) with \\(p\\) prime,\n\\(p\\nmid M\\operatorname{disc}(K)\\), there are eigenvalue data \\(D\\)\nat \\(Nw\\) of weight \\(m\\) and purity \\(1-n\\), with\n\\[\n |D.S|\\le c[M(H+1)]^A .\n\\]\nFor every odd prime \\(\\ell\\ne p\\), closure and coefficient comparison\n\\(\\iota\\), these same data classify the admitted\n\\(\\mathrm{AdmKNAlt}(\\iota,M,m)\\) representations of \\(G_K\\) at \\(w\\).",
