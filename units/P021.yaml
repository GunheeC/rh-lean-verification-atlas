  "statement": "For any data, constants and real $X_{pp}$ as above, assume the eleven hypotheses of Definition \\ref{def:L-hyps}. Then for every $u_0\\in U_0$\n\\[\n  ASK(u_0)\\le\\mathrm{Main}(u_0)+\\mathrm{Err}(u_0),\n\\]\nwhere, with\n$M_{Lo}=c_{Sl1}Lo_P+c_{Sl1}n_Tm(a/k+b')\\,c_{Count}mL+c_{Sl1}X_{pp}+1$,\n$V=2mc_EB_0+c_H(n_TaLa+mB_0)+A\\,c_{Count}\\log k$ and\n$\\bar U=c_{Slope}n_TaLa(2+m/k)+V+c_{Sl1}mB_0+M_{Lo}$,\n\\[\n\\begin{aligned}\n \\mathrm{Err}(u_0)={}&A\\,c_{Count}\\Bigl(La+\\frac{m^2La}{k}\\Bigr)+E_{Div}+m\\,c_EB_0\\\\\n &+c_{Slope}n_TaLa\\Bigl(1+\\frac mk\\Bigr)+\\log|W(u_0)|+Lo_P+M_{Lo}\\\\\n &+\\frac1{1-\\bar\\delta}\\Bigl(4\\log(1+x^{c_{HH}})\\,(\\bar U+b)+(\\bar\\eta+4\\sqrt{\\bar e})\\,x^{c_{HH}}b\\Bigr).\n\\end{aligned}\n\\]",
