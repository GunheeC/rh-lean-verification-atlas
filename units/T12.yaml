  "statement": "For every good number-field base $(F,E,\\sigma,B)$ and spaces $A,Y$ of\nranks $m,n\\ge1$, take opposite Hermitian and skew-Hermitian signs, with the\nsignature $(r,s)$ of $A$ satisfying $\\min(r,s)=0$. Fix a Hecke character\nrestricting as $\\eta^m$, any finite-index Darboux doubling model satisfying\nits splitting, rationality, invariance and theta-summation rules, a frame,\nstandard compact $K$ and height $a$. For every Haar measure with a\nfundamental domain $D$, every Schwartz vector $\\Phi$ with finite-dimensional\n$K$-span, and every $x$, the flat-section Eisenstein sum for\n$g\\mapsto l(\\omega(g)\\Phi)$ has a meromorphic continuation from a right\nhalf-plane, holomorphic at $s_0=(m-n)/2$, with value\n\\[\n E(x,s_0)=\n \\begin{cases}1,&n<m,\\\\2,&m\\le n\\end{cases}\n \\ \\mathop{\\mathrm{avg}}_{g\\in D}\\,\n       \\theta_F\\bigl(\\omega(x)S(g)\\Phi\\bigr).\n\\]\nThe average is taken with respect to the specified Haar measure.",
