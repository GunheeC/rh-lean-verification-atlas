  "statement": "For any number field $E$, algebraic closure $\\Omega$, valuation subring\nof $\\Omega$ over a finite place $w$, and resulting local field $E_w$,\nthere exist an Artin map and a parameter map from irreducible smooth\n$\\mathrm{GL}_n(E_w)$-classes of all ranks to Weil--Deligne parameters.\nThe map preserves dimension, agrees with reciprocity in rank one,\ntakes Langlands quotients of multisegments to the corresponding segment\nsums, takes cuspidals to irreducible parameters and commutes with real\nnorm twists. The absolute value of its determinant recovers that of the\ncentral character. For classes with good cuspidal support it respects\ncharacter twists, the full central character and duality, is injective\nagainst arbitrary classes, and yields a tame parameter in the presence\nof principal-congruence fixed vectors. Here each good cuspidal constituent\nhas rank one or, over a field isomorphic to $\\mathbb Q_p$, is a twist of\na representation with such fixed vectors.\n\nThe last law prescribes a tame type. Over the indicated unramified residue\nextension of degree $n$, let $\\vartheta$ be a regular residue-field character\nand let the inflated cuspidal type have the prescribed elliptic character\nvalues. The parameter has zero monodromy. At an inertia element whose Artin\nimage reduces to $z$, its inertial characteristic polynomial is\n$\\prod_{j=0}^{n-1}(X-\\vartheta(z^{p^j}))$, with restriction to the given\nbase as in the local law.",
