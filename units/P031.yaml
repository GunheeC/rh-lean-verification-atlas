  "statement": "Let \\(\\ell\\) be prime and let \\(L_0\\) contain a primitive \\(\\ell\\)-th\nroot if \\(\\ell\\) is odd, or a primitive fourth root if \\(\\ell=2\\).\nWrite \\(c_0\\) for the largest \\(c\\) such that \\(L_0\\) contains a\nprimitive \\(\\ell^c\\)-th root. There exists \\(\\gamma\\in G_{L_0}\\) whose\ncyclotomic image topologically generates the image and satisfies\n\\(v_\\ell(\\chi(\\gamma)-1)=c_0\\). The base contains a primitive\n\\(\\ell^{c_0}\\)-th root. For every \\(E\\ge1\\), every \\(m\\ge0\\), and\nevery degree-\\(\\ell^m\\) cyclotomic layer \\(L_m/L_0\\),\n\\[\n \\operatorname{shaInv}(L_m,\\ell,E)=\n \\operatorname{length}_{\\mathbb Z_\\ell}\n \\operatorname{coker}\\bigl(x_{\\mathrm{Tw}}(E,\\gamma)^{\\ell^m}-1\\bigr).\n\\]\nHere \\(x_{\\mathrm{Tw}}\\) is the twisted action on the dual of the\ninfinite-layer character module with the specified local conditions.",
